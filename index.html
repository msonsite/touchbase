<style>
  :root {
    color-scheme: light;
    --red: #EF463C; --red-deep: #C42828; --red-dark: #941914;
    --ink: #101820; --text: #3C3C3C; --muted: #6B6B6B;
    --line: #E2E2E2; --subtle: #F5F5F5; --white: #FFFFFF;
    --late-bg: #FDE8E7; --late-fg: #941914;
    --soon-bg: #FFF0E0; --soon-fg: #7A3E0C;
    --ok-bg: #E6F4F3;   --ok-fg: #1F5F5B;
    --purple-bg: #EFEAF6; --purple-fg: #4B3B6B;
    --radius: 10px; --radius-btn: 4px;
    --font: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --nav-h: 72px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--white); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; padding: 24px 20px calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px)) 20px; }

  h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; color: var(--ink); }
  h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--red-deep); }
  p { margin: 0; }
  .eyebrow { font-size: 14px; color: var(--muted); }
  .lead { font-size: 15px; font-weight: 300; }
  .small { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .body { font-size: 14px; line-height: 1.5; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .head-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .icon-btn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 9999px; border: 1px solid var(--line); background: var(--white); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; color: var(--text); text-decoration: none; }
  .icon-btn.red { border-color: var(--red); color: var(--red-deep); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn[aria-pressed="true"] { color: var(--red-deep); border-color: var(--red); }

  .btn { min-height: 48px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-btn); border: 1px solid var(--red); background: var(--white); color: var(--red-deep); font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 200ms var(--ease), color 200ms var(--ease); }
  .btn:hover { background: var(--red-deep); border-color: var(--red-deep); color: var(--white); }
  .btn.primary { background: var(--red-deep); border-color: var(--red-deep); color: var(--white); }
  .btn.primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn.block { width: 100%; min-height: 52px; font-size: 16px; }
  .btn.sm { min-height: 40px; font-size: 14px; padding: 0 12px; }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .btn svg { width: 18px; height: 18px; }
  .link { background: none; border: 0; padding: 10px 4px; cursor: pointer; color: var(--red-deep); font-size: 14px; font-weight: 700; text-decoration: none; }
  .link.muted { color: var(--muted); font-weight: 600; }
  .link.danger { color: var(--red-dark); }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .card.flat { box-shadow: none; }
  .card-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .card-name { font-size: 16px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .card-name svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--red); }
  .avatar { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .avatar.sm { width: 32px; height: 32px; font-size: 12px; }
  .avatar.lg { width: 72px; height: 72px; font-size: 24px; font-weight: 800; }
  .c-vrienden { background: var(--late-bg); color: var(--late-fg); }
  .c-klanten  { background: var(--ok-bg); color: var(--ok-fg); }
  .c-netwerk  { background: var(--purple-bg); color: var(--purple-fg); }
  .c-familie  { background: var(--subtle); color: var(--text); }

  .pill { align-self: flex-start; font-size: 12px; font-weight: 700; border-radius: 9999px; padding: 2px 9px; }
  .pill.late { background: var(--late-bg); color: var(--late-fg); }
  .pill.soon { background: var(--soon-bg); color: var(--soon-fg); }
  .pill.ok   { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.none { background: var(--subtle); color: var(--text); }

  .tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--subtle); }
  .tile-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .tile-text.static { cursor: default; }
  .tile-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .tile > svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .tile input[type=checkbox] { width: 22px; height: 22px; margin: 0; accent-color: var(--red); flex: 0 0 auto; }
  .tile.done .tile-title { text-decoration: line-through; color: var(--muted); }
  .section { display: flex; flex-direction: column; gap: 8px; }
  .overdue { color: var(--late-fg); font-weight: 700; }

  .empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 20px; border-radius: var(--radius); background: var(--subtle); }
  .empty p { font-size: 15px; line-height: 1.5; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-top: -8px; gap: 8px; }
  .profile { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .profile h1 { font-size: 24px; margin-top: 4px; }
  .profile .pill { align-self: center; padding: 3px 10px; }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .actions .btn { padding: 0 8px; font-size: 14px; }
  .memory { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.4; }
  .box { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--radius); background: var(--subtle); }
  .info { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .info a { color: var(--red-deep); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }

  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 12px; }
  .tl-rail { display: flex; flex-direction: column; align-items: center; width: 12px; flex: 0 0 auto; }
  .tl-dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 9999px; background: #999999; }
  .tl-dot.contact { background: var(--red); }
  .tl-dot.note { background: var(--white); border: 2px solid #999999; }
  .tl-line { flex: 1 1 auto; width: 1px; background: var(--line); }
  .tl-item:last-child .tl-line { display: none; }
  .tl-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 0 14px 0; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .tl-date { font-size: 12px; font-weight: 600; color: var(--muted); }
  .tl-who { font-size: 14px; font-weight: 700; color: var(--ink); }
  .tl-note { font-size: 14px; font-weight: 300; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .month { font-size: 13px; font-weight: 700; color: var(--muted); padding-top: 4px; }

  .quicknote { display: flex; flex-direction: column; gap: 8px; }
  .search, .input, .select, .textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-btn); font-size: 16px; color: var(--ink); background: var(--white); }
  .textarea { resize: vertical; line-height: 1.45; font-weight: 300; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .fchip { flex: 0 0 auto; min-height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--line); background: var(--white); font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--white); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)) 4px; }
  nav.bottom .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  nav.bottom button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; cursor: pointer; color: #5A5A5A; font-size: 11px; font-weight: 600; }
  nav.bottom button[aria-current="page"] { color: var(--red-deep); font-weight: 700; }
  nav.bottom svg { width: 22px; height: 22px; }
  .fab { position: fixed; z-index: 25; right: max(20px, calc((100vw - 560px) / 2 + 20px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); height: 52px; padding: 0 20px 0 16px; border-radius: 9999px; border: 0; background: var(--red-deep); color: var(--white); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); cursor: pointer; }
  .fab svg { width: 20px; height: 20px; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(16, 24, 32, 0.55); display: flex; align-items: flex-end; justify-content: center; animation: fade 200ms var(--ease); }
  .sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--white); border-radius: 20px 20px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; display: flex; flex-direction: column; gap: 18px; animation: rise 240ms var(--ease); }
  .grip { align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: var(--line); }
  .sheet-head { display: flex; align-items: center; gap: 12px; }
  .sheet-head h1 { font-size: 20px; line-height: 1.2; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .sheet, .toast { animation: none; } }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field > label, .field > .label, fieldset legend { font-size: 14px; font-weight: 700; color: var(--text); padding: 0; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid var(--line); background: var(--white); font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: background 180ms var(--ease), color 180ms var(--ease); }
  .chip input:checked + span { background: var(--red-deep); border-color: var(--red-deep); color: var(--white); }
  .chip input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .checkline { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
  .checkline input { width: 22px; height: 22px; margin: 0; accent-color: var(--red); flex: 0 0 auto; }

  .pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 50dvh; overflow-y: auto; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--white); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .pick .t { font-size: 15px; font-weight: 700; color: var(--ink); }
  .import-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .import-row input { width: 22px; height: 22px; margin: 0; accent-color: var(--red); flex: 0 0 auto; }
  .steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--white); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; font-weight: 800; color: var(--ink); }
  .stat span { font-size: 12px; color: var(--muted); }

  .toast-wrap { position: fixed; left: 0; right: 0; z-index: 80; bottom: calc(var(--nav-h) + 80px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; padding: 0 20px; pointer-events: none; }
  .toast { pointer-events: auto; max-width: 520px; background: var(--ink); color: var(--white); padding: 10px 10px 10px 16px; border-radius: var(--radius-btn); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; animation: fade 200ms var(--ease); }
  .toast button { background: none; border: 0; color: #FFB4AE; font-weight: 800; font-size: 14px; padding: 8px; cursor: pointer; }

  .login { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 32px 24px; max-width: 420px; margin: 0 auto; }
  .login h1 { font-size: 34px; }
  .login form { display: flex; flex-direction: column; gap: 14px; }
  .brandmark { width: 56px; height: 56px; border-radius: 14px; background: var(--red); display: flex; align-items: center; justify-content: center; }
  .loading { padding: 40px 20px; color: var(--muted); }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   1. INSTELLINGEN
   ═══════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://xjhiiscdbseaivjgigej.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DzcoIeaZ029YFTvaS0V8Uw_FHZq77Up';
const ALLOW_SIGNUP = true; // na het aanmaken van je account: op false zetten

// Publieke sleutel voor pushmeldingen (VAPID_PUBLIC_KEY uit sleutels-aanmaken.html)
const VAPID_PUBLIC_KEY = 'BKvn3e9bD82q38LWDy7vkQ_ZGlHpRuk2PrP6K7xGmLtTk0iYi6SXuodct0Hu6bS2s87GlULTj-v9zdXS9YSuibA';

/* ═══════════════════════════════════════════════════════════════════════
   2. VASTE LIJSTEN
   ═══════════════════════════════════════════════════════════════════════ */
const CIRCLES = { familie: 'Familie', vrienden: 'Vrienden', klanten: 'Klanten', netwerk: 'Netwerk' };
const RHYTHMS = [
  [0, 'Geen herinneringen'], [7, 'Elke week'], [14, 'Om de twee weken'], [30, 'Elke maand'],
  [61, 'Om de twee maanden'], [91, 'Elk kwartaal'], [182, 'Elk half jaar'], [365, 'Elk jaar']
];
// contact: telt als contactmoment (schuift de herinnering op)
const KINDS = {
  telefoon:    { label: 'Telefoon',       contact: true },
  bericht:     { label: 'Bericht',        contact: true },
  afspraak:    { label: 'Afspraak',       contact: true },
  koffie:      { label: 'Koffie of eten', contact: true },
  notitie:     { label: 'Notitie',        contact: false },
  gebeurtenis: { label: 'Gebeurtenis',    contact: false }
};
const isContactKind = (k) => !!(KINDS[k] && KINDS[k].contact);
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

/* ═══════════════════════════════════════════════════════════════════════
   3. HULPFUNCTIES
   ═══════════════════════════════════════════════════════════════════════ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000); // b min a
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = (iso) => cap(parseISO(iso).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtDay = (iso) => {
  const d = parseISO(iso);
  const same = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('nl-BE', same ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' });
};
const fmtMonth = (iso) => cap(parseISO(iso).toLocaleDateString('nl-BE', { month: 'long', year: 'numeric' }));
const initials = (name) => (name || '').trim().split(/\s+/).slice(0, 2).map((p) => p[0] || '').join('').toUpperCase() || '?';
const firstName = (name) => (name || '').trim().split(/\s+/)[0];
const rhythmLabel = (days) => (RHYTHMS.find(([d]) => d === days) || [0, `Elke ${days} dagen`])[1].toLowerCase();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function agoText(days) {
  if (days <= 0) return 'vandaag';
  if (days === 1) return 'gisteren';
  if (days < 14) return `${days} dagen geleden`;
  if (days < 63) return `${Math.round(days / 7)} weken geleden`;
  if (days < 365) { const m = Math.round(days / 30.4); return m === 1 ? '1 maand geleden' : `${m} maanden geleden`; }
  const y = Math.floor(days / 365);
  return y === 1 ? 'meer dan een jaar geleden' : `${y} jaar geleden`;
}
function untilText(iso) {
  const left = diffDays(todayISO(), iso);
  return left === 0 ? 'vandaag' : left === 1 ? 'morgen' : `over ${left} dagen`;
}
function whenText(iso) {
  const left = diffDays(todayISO(), iso);
  if (left === 0) return 'Vandaag';
  if (left === 1) return 'Morgen';
  if (left === -1) return 'Gisteren';
  if (left < 0) return `${-left} dagen te laat`;
  if (left < 7) return fmtLong(iso);
  return fmtDay(iso);
}

const S = 'aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  plus:   `<svg ${S} stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>`,

/* ═══════════════════════════════════════════════════════════════════════
   4. TOESTAND
   ═══════════════════════════════════════════════════════════════════════ */
const state = {
  session: null, loaded: false,
  contacts: [], interactions: [], promises: [], dates: [],
  view: 'today', contactId: null, returnTo: 'today',
  search: '', circleFilter: 'alle', showArchived: false,
  logSearch: '', logFilter: 'alles',
  showDone: false,
  sheet: null,            // { type, ... }
  importItems: null,      // voorbeeldlijst bij importeren
  push: 'checking'
};
let lastByContact = new Map();
let db = null;

const active = () => state.contacts.filter((c) => !c.archived);
const contactById = (id) => state.contacts.find((c) => c.id === id);

/* ═══════════════════════════════════════════════════════════════════════
   5. BEREKENINGEN
   ═══════════════════════════════════════════════════════════════════════ */
function rebuildIndex() {
  lastByContact = new Map();
  for (const i of state.interactions) {
    if (!isContactKind(i.kind)) continue;
    const cur = lastByContact.get(i.contact_id);
    if (!cur || i.happened_on > cur) lastByContact.set(i.contact_id, i.happened_on);
  }
}

function statusOf(c) {
  const today = todayISO();
  const last = lastByContact.get(c.id) || null;
  const sub = last ? agoText(diffDays(last, today)) : 'nog geen contact gelogd';
  if (!c.rhythm_days && !c.next_contact_on) return { last, due: null, left: Infinity, key: 'none', label: '', sub };
  const due = c.next_contact_on || (last ? addDays(last, c.rhythm_days) : today);
  const left = diffDays(today, due);
  const windowDays = Math.max(2, Math.min(7, Math.round((c.rhythm_days || 14) * 0.2)));
  let key = left < 0 ? 'late' : left <= windowDays ? 'soon' : 'ok';
  let label = key === 'late' ? 'Te lang geleden' : key === 'soon' ? (left === 0 ? 'Vandaag' : 'Binnenkort') : 'Op schema';
  if (!last && !c.next_contact_on) { key = 'soon'; label = 'Nog niet gelogd'; }
  return { last, due, left, key, label, sub };
}

function nextOccurrence(day, month) {
  const t = parseISO(todayISO());
  const d = new Date(t.getFullYear(), month - 1, day);
  if (d < t) d.setFullYear(t.getFullYear() + 1);
  return toISO(d);
}

// Verjaardagen en belangrijke datums binnen `days` dagen
function upcomingMoments(days = 14, contactId = null) {
  const out = [];
  for (const c of active()) {
    if (contactId && c.id !== contactId) continue;
    if (c.birthday_day && c.birthday_month) {
      const d = nextOccurrence(c.birthday_day, c.birthday_month);
      out.push({ c, label: 'Verjaardag', iso: d, year: c.birthday_year, kind: 'bday' });
    }
  }
  for (const m of state.dates) {
    const c = contactById(m.contact_id);
    if (!c || c.archived || (contactId && c.id !== contactId)) continue;
    out.push({ c, label: m.label, iso: nextOccurrence(m.day, m.month), year: m.year, kind: 'date', id: m.id });
  }
  const today = todayISO();
  return out.filter((m) => contactId || diffDays(today, m.iso) <= days).sort((a, b) => a.iso.localeCompare(b.iso));
}
const ageText = (m) => (m.year ? (m.kind === 'bday' ? ` · wordt ${parseISO(m.iso).getFullYear() - m.year}` : ` · ${parseISO(m.iso).getFullYear() - m.year} jaar`) : '');

/* ═══════════════════════════════════════════════════════════════════════
   6. DATABASE
   ═══════════════════════════════════════════════════════════════════════ */
async function loadAll() {
  const [c, i, p, d] = await Promise.all([
    db.from('contacts').select('*').order('name'),
    db.from('interactions').select('*').order('happened_on', { ascending: false }).order('created_at', { ascending: false }),
    db.from('promises').select('*').order('created_at', { ascending: false }),
    db.from('important_dates').select('*')
  ]);
  const err = c.error || i.error || p.error || d.error;
  if (err) {
    const hint = /important_dates|column|does not exist|schema cache/i.test(err.message) ? ' Voer update-v3.sql uit in Supabase.' : '';
    toast('Laden mislukt: ' + err.message + hint);
    return;
  }
  state.contacts = c.data; state.interactions = i.data; state.promises = p.data; state.dates = d.data;
  state.loaded = true;
  rebuildIndex();
  render();
}

async function run(promise, okMessage) {
  const { error } = await promise;
  if (error) { toast('Opslaan mislukt: ' + error.message); return false; }
  if (okMessage) toast(okMessage);
  await loadAll();
  return true;
}

async function removeWithUndo(table, row, message) {
  const { error } = await db.from(table).delete().eq('id', row.id);
  if (error) { toast('Verwijderen mislukt: ' + error.message); return; }
  state.sheet = null;
  await loadAll();
  toast(message, async () => {
    const { user_id, ...copy } = row;
    const { error: e2 } = await db.from(table).insert(copy);
    if (e2) toast('Terugzetten mislukt: ' + e2.message);
    else { toast('Teruggezet'); loadAll(); }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   7. BOUWSTENEN
   ═══════════════════════════════════════════════════════════════════════ */
const avatar = (c, size = '') => `<div class="avatar ${size} c-${c.circle}" aria-hidden="true">${esc(initials(c.name))}</div>`;

function contactCard(c, { withLog = true, showStatus = true } = {}) {
  const s = statusOf(c);
  const meta = [CIRCLES[c.circle], c.company].filter(Boolean).map(esc).join(' · ');
  return `
  <div class="card">
    ${avatar(c)}
    <button class="card-main" data-action="open-contact" data-id="${c.id}">
      <span class="card-name">${esc(c.name)}${c.favorite ? ICON.starF : ''}</span>
      <span class="small">${meta} · ${s.sub}</span>
      ${showStatus && (s.key === 'late' || s.key === 'soon') ? `<span class="pill ${s.key}">${s.label}</span>` : ''}
    </button>
    ${withLog ? `<button class="icon-btn red" data-action="log" data-id="${c.id}" aria-label="Loggen voor ${esc(c.name)}">${ICON.plus}</button>` : ''}
  </div>`;
}

function promiseRow(p, showWho = true) {
  const who = p.contact_id ? contactById(p.contact_id) : null;
  const today = todayISO();
  const late = p.due_on && !p.done && p.due_on < today;
  const bits = [];
  if (showWho && who) bits.push(esc(who.name));
  if (p.due_on) bits.push(`<span class="${late ? 'overdue' : ''}">${p.done ? 'Deadline ' + fmtDay(p.due_on) : whenText(p.due_on)}</span>`);
  if (!p.due_on) bits.push('Beloofd op ' + fmtDay(p.promised_on));
  return `
  <div class="tile ${p.done ? 'done' : ''}">
    <input type="checkbox" data-change="toggle-promise" data-id="${p.id}" ${p.done ? 'checked' : ''} aria-label="${esc(p.description)} afvinken">
    <button class="tile-text" data-action="edit-promise" data-id="${p.id}">
      <span class="tile-title">${esc(p.description)}</span>
      <span class="small">${bits.join(' · ')}</span>
    </button>
  </div>`;
}

function timelineItem(i, { showWho = false } = {}) {
  const c = contactById(i.contact_id);
  const k = KINDS[i.kind] || { label: i.kind, contact: false };
  return `
  <div class="tl-item">
    <div class="tl-rail"><span class="tl-dot ${k.contact ? 'contact' : 'note'}"></span><span class="tl-line"></span></div>
    <button class="tl-body" data-action="edit-interaction" data-id="${i.id}" aria-label="${esc(k.label)} van ${fmtDay(i.happened_on)} bewerken">
      ${showWho && c ? `<span class="tl-who">${esc(c.name)}</span>` : ''}
      <span class="tl-date">${fmtDay(i.happened_on)} · ${esc(k.label.toLowerCase())}</span>
      ${i.note ? `<span class="tl-note">${esc(i.note)}</span>` : ''}
    </button>
  </div>`;
}

function momentTile(m) {
  return `
  <div class="tile">
    ${ICON.gift}
    <button class="tile-text" data-action="open-contact" data-id="${m.c.id}">
      <span class="tile-title">${m.kind === 'bday' ? 'Verjaardag' : esc(m.label)} van ${esc(firstName(m.c.name))}</span>
      <span class="small">${whenText(m.iso)}${ageText(m)}</span>
    </button>
    ${m.c.phone ? `<a class="link" href="sms:${esc(m.c.phone.replace(/\s+/g, ''))}">Bericht</a>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   8. SCHERMEN
   ═══════════════════════════════════════════════════════════════════════ */
function viewToday() {
  const today = todayISO();
  const people = active();
  const due = people.map((c) => ({ c, s: statusOf(c) })).filter(({ s }) => s.key === 'late' || s.key === 'soon').sort((a, b) => a.s.left - b.s.left);
  const moments = upcomingMoments(14);
  const open = state.promises.filter((p) => !p.done).sort((a, b) => (a.due_on || '9999').localeCompare(b.due_on || '9999')).slice(0, 3);
  const recent = state.interactions.filter((i) => contactById(i.contact_id) && !contactById(i.contact_id).archived).slice(0, 3);
  const anyRhythm = people.some((c) => c.rhythm_days > 0 || c.next_contact_on);

  let dueBlock;
  if (!people.length) {
    dueBlock = `
    <div class="empty">
      <p>Voeg de mensen toe die je niet uit het oog wilt verliezen. Je kunt gewoon notities bijhouden, en waar je wilt een herinnering instellen.</p>
      <div class="row-btns">
        <button class="btn primary" data-action="new-contact">${ICON.plus} Contact toevoegen</button>
        <button class="btn" data-action="import">${ICON.upload} Importeren</button>
      </div>
    </div>`;
  } else if (!due.length) {
    dueBlock = `<div class="empty"><p>${anyRhythm
      ? 'Niemand aan de beurt. De volgende persoon verschijnt hier zodra het weer tijd is.'
      : 'Er staan geen herinneringen aan. Wil je iemand niet uit het oog verliezen? Kies bij die persoon hoe vaak je contact wilt houden.'}</p></div>`;
  } else {
    dueBlock = `<div class="list">${due.map(({ c }) => contactCard(c)).join('')}</div>`;
  }

  return `
  <div class="head">
    <div class="head-text">
      <p class="eyebrow">${fmtLong(today)}</p>
      <h1>Aan de beurt</h1>
      ${people.length ? `<p class="lead">${due.length ? plural(due.length, 'persoon', 'mensen') + ' om te contacteren' : 'Niemand vandaag'}</p>` : ''}
    </div>
    <button class="icon-btn" data-action="go" data-view="contacts" aria-label="Contacten zoeken">${ICON.search}</button>
  </div>
  ${dueBlock}
  ${moments.length ? `<section class="section"><h2>Binnenkort</h2>${moments.map(momentTile).join('')}</section>` : ''}
  ${open.length ? `
  <section class="section">
    <div class="sec-head"><h2>Open beloftes</h2><button class="link" data-action="go" data-view="promises">Alle beloftes</button></div>
    ${open.map((p) => promiseRow(p)).join('')}
  </section>` : ''}
  ${recent.length ? `
  <section class="section">
    <div class="sec-head"><h2>Recent gelogd</h2><button class="link" data-action="go" data-view="log">Logboek</button></div>
    <div class="timeline">${recent.map((i) => timelineItem(i, { showWho: true })).join('')}</div>
  </section>` : ''}`;
}

function contactsResults() {
  const q = state.search.trim().toLowerCase();
  const pool = state.showArchived ? state.contacts.filter((c) => c.archived) : active();
  const filtered = pool.filter((c) => {
    if (state.circleFilter === 'favorieten' && !c.favorite) return false;
    if (CIRCLES[state.circleFilter] && c.circle !== state.circleFilter) return false;
    if (!q) return true;
    return [c.name, c.company, c.email, c.memory].some((v) => (v || '').toLowerCase().includes(q));
  });
  const favs = !state.showArchived && state.circleFilter === 'alle' && !q ? filtered.filter((c) => c.favorite) : [];
  const rest = filtered.filter((c) => !favs.includes(c));
  const groups = Object.keys(CIRCLES).map((k) => ({ k, items: rest.filter((c) => c.circle === k) })).filter((g) => g.items.length);
  const archivedCount = state.contacts.filter((c) => c.archived).length;
  return `
  ${favs.length ? `<section class="section"><h2>Favorieten</h2><div class="list">${favs.map((c) => contactCard(c, { withLog: false })).join('')}</div></section>` : ''}
  ${groups.map((g) => `<section class="section"><h2>${CIRCLES[g.k]}</h2><div class="list">${g.items.map((c) => contactCard(c, { withLog: false })).join('')}</div></section>`).join('')}
  ${!filtered.length ? `<div class="empty"><p>${q || state.circleFilter !== 'alle' ? 'Niemand gevonden.' : state.showArchived ? 'Geen gearchiveerde contacten.' : 'Nog geen contacten.'}</p>
    ${!q && !state.showArchived && state.circleFilter === 'alle' ? `<div class="row-btns"><button class="btn primary" data-action="new-contact">${ICON.plus} Contact toevoegen</button><button class="btn" data-action="import">${ICON.upload} Importeren</button></div>` : ''}</div>` : ''}
  ${archivedCount || state.showArchived ? `<button class="link muted" style="align-self:flex-start;padding-left:0" data-action="toggle-archived">${state.showArchived ? 'Terug naar je contacten' : `Gearchiveerde contacten (${archivedCount})`}</button>` : ''}`;
}

function viewContacts() {
  const pool = state.showArchived ? state.contacts.filter((c) => c.archived) : active();
  const filterBtn = (key, label) => `<button class="fchip" data-action="circle-filter" data-key="${key}" aria-pressed="${state.circleFilter === key}">${label}</button>`;
  return `
  <div class="head">
    <div class="head-text">
      <h1>${state.showArchived ? 'Gearchiveerd' : 'Contacten'}</h1>
      <p class="lead">${plural(pool.length, 'persoon', 'mensen')}</p>
    </div>
    <div class="head-actions">
      <button class="icon-btn" data-action="import" aria-label="Contacten importeren">${ICON.upload}</button>
      <button class="icon-btn red" data-action="new-contact" aria-label="Contact toevoegen">${ICON.plus}</button>
    </div>
  </div>
  <label><span class="sr">Zoeken</span>
    <input class="search" type="search" placeholder="Zoeken op naam, bedrijf of notitie" value="${esc(state.search)}" data-input="search" autocomplete="off">
  </label>
  <div class="filters" role="group" aria-label="Filter">
    ${filterBtn('alle', 'Alle')}${filterBtn('favorieten', 'Favorieten')}${Object.entries(CIRCLES).map(([k, v]) => filterBtn(k, v)).join('')}
  </div>
  <div id="results" style="display:flex;flex-direction:column;gap:22px">${contactsResults()}</div>`;
}

function logResults() {
  const q = state.logSearch.trim().toLowerCase();
  const items = state.interactions.filter((i) => {
    const c = contactById(i.contact_id);
    if (!c) return false;
    if (state.logFilter === 'contact' && !isContactKind(i.kind)) return false;
    if (state.logFilter === 'notities' && isContactKind(i.kind)) return false;
    if (!q) return true;
    return (i.note || '').toLowerCase().includes(q) || c.name.toLowerCase().includes(q);
  });
  const groups = [];
  for (const i of items) {
    const key = i.happened_on.slice(0, 7);
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, iso: i.happened_on, items: [] });
    groups[groups.length - 1].items.push(i);
  }
  return groups.length ? groups.map((g) => `
    <section class="section">
      <p class="month">${fmtMonth(g.iso)}</p>
      <div class="timeline">${g.items.map((i) => timelineItem(i, { showWho: true })).join('')}</div>
    </section>`).join('') : `<div class="empty"><p>${q || state.logFilter !== 'alles' ? 'Niets gevonden.' : 'Hier komt alles wat je logt: gesprekken, notities en gebeurtenissen. Tik op Loggen om te beginnen.'}</p></div>`;
}

function viewLog() {
  const filterBtn = (key, label) => `<button class="fchip" data-action="log-filter" data-key="${key}" aria-pressed="${state.logFilter === key}">${label}</button>`;
  return `
  <div class="head">
    <div class="head-text"><h1>Logboek</h1><p class="lead">${plural(state.interactions.length, 'notitie', 'notities')} en contactmomenten</p></div>
  </div>
  <label><span class="sr">Zoeken in logboek</span>
    <input class="search" type="search" placeholder="Zoeken in notities of op naam" value="${esc(state.logSearch)}" data-input="logsearch" autocomplete="off">
  </label>
  <div class="filters" role="group" aria-label="Filter">${filterBtn('alles', 'Alles')}${filterBtn('contact', 'Contactmomenten')}${filterBtn('notities', 'Notities en gebeurtenissen')}</div>
  <div id="results" style="display:flex;flex-direction:column;gap:22px">${logResults()}</div>`;
}

function viewPromises() {
  const open = state.promises.filter((p) => !p.done).sort((a, b) => (a.due_on || '9999').localeCompare(b.due_on || '9999') || b.created_at.localeCompare(a.created_at));
  const done = state.promises.filter((p) => p.done).sort((a, b) => (b.done_at || '').localeCompare(a.done_at || ''));
  return `
  <div class="head">
    <div class="head-text"><h1>Beloftes</h1><p class="lead">${open.length ? `${open.length} open` : 'Alles is afgewerkt'}</p></div>
    <button class="icon-btn red" data-action="new-promise" aria-label="Belofte toevoegen">${ICON.plus}</button>
  </div>
  ${open.length ? `<section class="section">${open.map((p) => promiseRow(p)).join('')}</section>`
    : `<div class="empty"><p>Beloofde je iemand iets door te sturen of te regelen? Noteer het hier. Een persoon of deadline koppelen mag, maar hoeft niet.</p>
       <button class="btn primary" data-action="new-promise">${ICON.plus} Belofte toevoegen</button></div>`}
  ${done.length ? `
  <section class="section">
    <button class="link muted" style="align-self:flex-start;padding-left:0" data-action="toggle-done" aria-expanded="${state.showDone}">
      ${state.showDone ? 'Afgewerkte beloftes verbergen' : `Afgewerkte beloftes tonen (${done.length})`}
    </button>
    ${state.showDone ? done.slice(0, 50).map((p) => promiseRow(p)).join('') : ''}
  </section>` : ''}`;
}

function viewMore() {
  const today = todayISO();
  const monthStart = today.slice(0, 8) + '01';
  const ninety = addDays(today, -90);
  const contactsThisMonth = state.interactions.filter((i) => isContactKind(i.kind) && i.happened_on >= monthStart).length;
  const notes = state.interactions.filter((i) => !isContactKind(i.kind)).length;
  const counts = new Map();
  for (const i of state.interactions) if (isContactKind(i.kind) && i.happened_on >= ninety) counts.set(i.contact_id, (counts.get(i.contact_id) || 0) + 1);
  const top = [...counts.entries()].map(([id, n]) => ({ c: contactById(id), n })).filter((x) => x.c && !x.c.archived).sort((a, b) => b.n - a.n).slice(0, 3);
  const longest = active().filter((c) => lastByContact.get(c.id)).sort((a, b) => lastByContact.get(a.id).localeCompare(lastByContact.get(b.id))).slice(0, 3);

  return `
  <div class="head"><div class="head-text"><h1>Meer</h1></div></div>
  <section class="box">
    <h2>Overzicht</h2>
    <div class="stats">
      <div class="stat"><b>${active().length}</b><span>contacten</span></div>
      <div class="stat"><b>${contactsThisMonth}</b><span>contacten deze maand</span></div>
      <div class="stat"><b>${notes}</b><span>notities</span></div>
    </div>
    ${top.length ? `<p class="small" style="margin-top:6px"><strong>Meest gesproken (90 dagen):</strong> ${top.map((x) => `${esc(x.c.name)} (${x.n}×)`).join(', ')}</p>` : ''}
    ${longest.length ? `<p class="small"><strong>Langst niet gesproken:</strong> ${longest.map((c) => `${esc(c.name)} (${agoText(diffDays(lastByContact.get(c.id), today))})`).join(', ')}</p>` : ''}
  </section>
  ${pushSection()}
  <section class="box">
    <h2>Contacten importeren</h2>
    <p class="small">Neem contacten over van je iPhone via een vCard-bestand.</p>
    <button class="btn" style="align-self:flex-start" data-action="import">${ICON.upload} Importeren</button>
  </section>
  <section class="box">
    <h2>Je gegevens</h2>
    <p class="small">Download alles als één bestand, als back-up.</p>
    <button class="btn" style="align-self:flex-start" data-action="export">Gegevens downloaden</button>
  </section>
  <section class="box">
    <h2>Zo werkt het</h2>
    <p class="small"><strong>Loggen</strong> kan altijd, zonder datums of herinneringen: een gesprek, een notitie of een gebeurtenis.</p>
    <p class="small"><strong>Herinneringen</strong> zijn optioneel. Kies bij een persoon hoe vaak je contact wilt houden; na elk gesprek schuift de volgende datum mee.</p>
    <p class="small"><strong>Notities en gebeurtenissen</strong> komen in de tijdlijn, maar tellen niet als contact.</p>
  </section>
  <section class="box">
    <h2>Account</h2>
    <p class="small">Ingelogd als ${esc(state.session?.user?.email || '')}</p>
    <button class="btn" style="align-self:flex-start" data-action="logout">Uitloggen</button>
  </section>`;
}

function viewContact() {
  const c = contactById(state.contactId);
  if (!c) { state.view = 'today'; return viewToday(); }
  const s = statusOf(c);
  const items = state.interactions.filter((i) => i.contact_id === c.id);
  const proms = state.promises.filter((p) => p.contact_id === c.id && !p.done);
  const memory = (c.memory || '').split('\n').map((l) => l.trim()).filter(Boolean);
  const moments = upcomingMoments(366, c.id);
  const tel = c.phone ? esc(c.phone.replace(/\s+/g, '')) : '';
  const meta = [CIRCLES[c.circle], c.company].filter(Boolean).map(esc).join(' · ');

  let reminder;
  if (s.key === 'none') {
    reminder = `<p class="small">Geen herinneringen. ${s.last ? `Laatste contact ${s.sub}.` : ''}</p>
      <button class="link" style="align-self:flex-start;padding-left:0" data-action="edit-contact" data-id="${c.id}">Herinneringen instellen</button>`;
  } else {
    reminder = `<p class="body"><span class="pill ${s.key}">${s.label}</span></p>
      <p class="small">${c.rhythm_days ? cap(rhythmLabel(c.rhythm_days)) + ' · ' : ''}${s.left < 0 ? 'was voorzien op ' + fmtDay(s.due) : s.left === 0 ? 'volgend contact vandaag' : 'volgend contact ' + fmtDay(s.due)} · laatste contact ${s.sub}</p>`;
  }

  return `
  <div class="topbar">
    <button class="icon-btn" data-action="back" aria-label="Terug">${ICON.back}</button>
    <div class="head-actions">
      <button class="icon-btn" data-action="toggle-favorite" data-id="${c.id}" aria-pressed="${!!c.favorite}" aria-label="Favoriet">${c.favorite ? ICON.starF : ICON.star}</button>
      <button class="link" data-action="edit-contact" data-id="${c.id}">Bewerken</button>
    </div>
  </div>
  <div class="profile">
    ${avatar(c, 'lg')}
    <h1>${esc(c.name)}</h1>
    <p class="small" style="font-size:14px">${meta}${c.archived ? ' · gearchiveerd' : ''}</p>
  </div>
  <div class="actions">
    <a class="btn" ${tel ? `href="tel:${tel}"` : 'aria-disabled="true"'}>${ICON.phone} Bellen</a>
    ${tel || !c.email
      ? `<a class="btn" ${tel ? `href="sms:${tel}"` : 'aria-disabled="true"'}>${ICON.chat} Bericht</a>`
      : `<a class="btn" href="mailto:${esc(c.email)}">${ICON.mail} Mail</a>`}
    <button class="btn primary" data-action="log" data-id="${c.id}">${ICON.plus} Loggen</button>
  </div>
  ${c.phone || c.email ? `<div class="info">
    ${c.phone ? `<a href="tel:${tel}">${esc(c.phone)}</a>` : ''}
    ${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}
  </div>` : ''}

  <form class="quicknote" data-form="quicknote" data-id="${c.id}">
    <label class="sr" for="qn">Snelle notitie</label>
    <textarea class="textarea" id="qn" name="note" rows="2" placeholder="Snelle notitie over ${esc(firstName(c.name))}…" required></textarea>
    <button class="btn sm" type="submit" style="align-self:flex-end">Notitie opslaan</button>
  </form>

  <section class="box">
    <h2>Herinneringen</h2>
    ${reminder}
  </section>

  <section class="box">
    <h2>Om te onthouden</h2>
    ${memory.length ? `<ul class="memory">${memory.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>` : `<p class="small">Partner, kinderen, hobby’s, nieuwe job… Voeg toe via Bewerken.</p>`}
  </section>

  <section class="section">
    <div class="sec-head"><h2>Belangrijke datums</h2><button class="link" data-action="new-date" data-id="${c.id}">Toevoegen</button></div>
    ${moments.length ? moments.map((m) => `
      <div class="tile">
        ${m.kind === 'bday' ? ICON.gift : ICON.cal}
        <button class="tile-text" data-action="${m.kind === 'bday' ? 'edit-contact' : 'edit-date'}" data-id="${m.kind === 'bday' ? c.id : m.id}">
          <span class="tile-title">${esc(m.label)}</span>
          <span class="small">${parseISO(m.iso).getDate()} ${MONTHS[parseISO(m.iso).getMonth()]}${m.year ? ' ' + m.year : ''} · ${untilText(m.iso)}</span>
        </button>
      </div>`).join('') : `<p class="small">Verjaardag, trouwdag, verjaardag van de kinderen…</p>`}
  </section>

  <section class="section">
    <div class="sec-head"><h2>Beloftes</h2><button class="link" data-action="new-promise" data-id="${c.id}">Toevoegen</button></div>
    ${proms.length ? proms.map((p) => promiseRow(p, false)).join('') : `<p class="small">Geen open beloftes.</p>`}
  </section>

  <section class="section">
    <h2>Tijdlijn</h2>
    ${items.length ? `<div class="timeline">${items.map((i) => timelineItem(i)).join('')}</div>` : `<p class="small">Nog niets gelogd.</p>`}
  </section>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   9. PANELEN
   ═══════════════════════════════════════════════════════════════════════ */
const sheetFrame = (form, title, body, extra = '') => `
  <form class="sheet" ${form} aria-labelledby="sheet-title">
    <span class="grip" aria-hidden="true"></span>
    ${title}
    ${body}
    ${extra}
    <button class="link muted" type="button" data-action="close-sheet">Annuleren</button>
  </form>`;

const nextHint = (c, fromISO) => `Rond ${fmtDay(addDays(fromISO, c.rhythm_days))} (${rhythmLabel(c.rhythm_days)})`;

function sheetLog(c, i) {
  const today = todayISO();
  const editing = !!i;
  const kind = editing ? i.kind : 'notitie';
  const hasRhythm = c.rhythm_days > 0;
  return sheetFrame(`data-form="log" data-id="${c.id}" ${editing ? `data-iid="${i.id}"` : ''}`,
    `<div class="sheet-head">${avatar(c)}<div style="display:flex;flex-direction:column;gap:2px">
      <h1 id="sheet-title">${editing ? 'Bewerken' : 'Loggen voor ' + esc(firstName(c.name))}</h1>
      <span class="small">${esc(c.name)}</span></div></div>`,
    `<fieldset>
      <legend>Wat wil je loggen?</legend>
      <div class="chips">
        ${Object.entries(KINDS).map(([k, v]) => `<label class="chip"><input type="radio" name="kind" value="${k}" ${k === kind ? 'checked' : ''}><span>${v.label}</span></label>`).join('')}
      </div>
      <p class="hint" data-kind-hint></p>
    </fieldset>
    <div class="field">
      <label for="log-note">Notitie</label>
      <textarea class="textarea" id="log-note" name="note" rows="4" placeholder="Wat wil je onthouden?">${editing ? esc(i.note || '') : ''}</textarea>
      <button type="button" class="btn sm" style="align-self:flex-start" data-action="dictate" hidden>${ICON.mic} <span>Inspreken</span></button>
    </div>
    <div class="field">
      <label for="log-date">Datum</label>
      <input class="input" id="log-date" type="date" name="happened_on" value="${editing ? i.happened_on : today}" max="${today}" required>
    </div>
    ${editing ? '' : `
    <fieldset data-next-section>
      <legend>Herinnering</legend>
      <div class="chips">
        ${hasRhythm
          ? `<label class="chip"><input type="radio" name="next_mode" value="auto" checked><span>Volgens ritme</span></label>`
          : `<label class="chip"><input type="radio" name="next_mode" value="none" checked><span>Geen</span></label>`}
        <label class="chip"><input type="radio" name="next_mode" value="date"><span>Op een datum</span></label>
      </div>
      <p class="hint" data-next-hint>${hasRhythm ? nextHint(c, today) : 'Geen herinnering voor deze persoon.'}</p>
      <input class="input" type="date" name="next_contact_on" aria-label="Datum van de herinnering" min="${today}" hidden>
    </fieldset>`}
    <button class="btn primary block" type="submit">${editing ? 'Wijzigingen opslaan' : 'Opslaan'}</button>`,
    editing ? `<button class="link danger" type="button" data-action="delete-interaction" data-id="${i.id}">Verwijderen</button>` : '');
}

function sheetPick() {
  const people = active().slice().sort((a, b) => (b.favorite - a.favorite) || (lastByContact.get(b.id) || '').localeCompare(lastByContact.get(a.id) || '') || a.name.localeCompare(b.name));
  return `
  <div class="sheet" role="dialog" aria-labelledby="sheet-title">
    <span class="grip" aria-hidden="true"></span>
    <div class="sheet-head"><h1 id="sheet-title">Voor wie wil je loggen?</h1></div>
    <label><span class="sr">Zoeken</span><input class="search" type="search" placeholder="Zoeken op naam" data-input="pick" autocomplete="off"></label>
    <div class="pick-list">
      ${people.map((c) => `<button class="pick" data-action="pick-contact" data-id="${c.id}" data-name="${esc(c.name.toLowerCase())}">${avatar(c, 'sm')}<span class="t">${esc(c.name)}</span></button>`).join('')}
      ${people.length ? '' : '<p class="small">Nog geen contacten.</p>'}
    </div>
    <button class="btn" data-action="new-contact">${ICON.plus} Nieuw contact</button>
    <button class="link muted" type="button" data-action="close-sheet">Annuleren</button>
  </div>`;
}

function sheetContact(c) {
  const isNew = !c;
  c = c || { name: '', circle: 'vrienden', rhythm_days: 0, phone: '', email: '', company: '', birthday_day: null, birthday_month: null, birthday_year: null, memory: '', favorite: false };
  const thisYear = new Date().getFullYear();
  return sheetFrame(`data-form="contact" ${isNew ? '' : `data-id="${c.id}"`}`,
    `<div class="sheet-head"><h1 id="sheet-title">${isNew ? 'Nieuw contact' : 'Contact bewerken'}</h1></div>`,
    `<div class="field"><label for="f-name">Naam</label><input class="input" id="f-name" name="name" value="${esc(c.name)}" required maxlength="120" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label for="f-circle">Kring</label>
        <select class="select" id="f-circle" name="circle">${Object.entries(CIRCLES).map(([k, v]) => `<option value="${k}" ${c.circle === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="f-rhythm">Herinneringen</label>
        <select class="select" id="f-rhythm" name="rhythm_days">${RHYTHMS.map(([d, l]) => `<option value="${d}" ${c.rhythm_days === d ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-phone">Telefoon</label><input class="input" id="f-phone" name="phone" type="tel" value="${esc(c.phone || '')}" placeholder="+32 …" autocomplete="off"></div>
    <div class="field"><label for="f-email">E-mail</label><input class="input" id="f-email" name="email" type="email" value="${esc(c.email || '')}" autocomplete="off"></div>
    <div class="field"><label for="f-company">Bedrijf of functie</label><input class="input" id="f-company" name="company" value="${esc(c.company || '')}" autocomplete="off"></div>
    <fieldset>
      <legend>Verjaardag</legend>
      <div class="row3">
        <select class="select" name="birthday_day" aria-label="Dag"><option value="">Dag</option>${Array.from({ length: 31 }, (_, i) => i + 1).map((d) => `<option value="${d}" ${c.birthday_day === d ? 'selected' : ''}>${d}</option>`).join('')}</select>
        <select class="select" name="birthday_month" aria-label="Maand"><option value="">Maand</option>${MONTHS.map((m, i) => `<option value="${i + 1}" ${c.birthday_month === i + 1 ? 'selected' : ''}>${m}</option>`).join('')}</select>
        <input class="input" name="birthday_year" type="number" inputmode="numeric" min="1900" max="${thisYear}" placeholder="Jaar" aria-label="Geboortejaar (optioneel)" value="${c.birthday_year || ''}">
      </div>
    </fieldset>
    <div class="field">
      <label for="f-memory">Om te onthouden</label>
      <textarea class="textarea" id="f-memory" name="memory" rows="4" placeholder="Eén ding per regel">${esc(c.memory || '')}</textarea>
    </div>
    <label class="checkline"><input type="checkbox" name="favorite" ${c.favorite ? 'checked' : ''}> Favoriet</label>
    <button class="btn primary block" type="submit">${isNew ? 'Contact toevoegen' : 'Wijzigingen opslaan'}</button>`,
    isNew ? '' : `
    <button class="link" type="button" data-action="archive-contact" data-id="${c.id}">${c.archived ? 'Uit archief halen' : 'Archiveren'}</button>
    <button class="link danger" type="button" data-action="delete-contact" data-id="${c.id}">Definitief verwijderen</button>`);
}

function sheetPromise(p, contactId) {
  const editing = !!p;
  p = p || { description: '', contact_id: contactId || '', due_on: '' };
  return sheetFrame(`data-form="promise" ${editing ? `data-id="${p.id}"` : ''}`,
    `<div class="sheet-head"><h1 id="sheet-title">${editing ? 'Belofte bewerken' : 'Nieuwe belofte'}</h1></div>`,
    `<div class="field"><label for="p-desc">Wat heb je beloofd?</label>
      <input class="input" id="p-desc" name="description" value="${esc(p.description)}" required maxlength="300" placeholder="Bijvoorbeeld: foto’s doorsturen" autocomplete="off"></div>
    <div class="field"><label for="p-who">Aan wie? <span class="hint">(optioneel)</span></label>
      <select class="select" id="p-who" name="contact_id">
        <option value="">Niemand in het bijzonder</option>
        ${active().map((c) => `<option value="${c.id}" ${c.id === p.contact_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
      </select></div>
    <div class="field"><label for="p-due">Deadline <span class="hint">(optioneel)</span></label>
      <input class="input" id="p-due" name="due_on" type="date" value="${p.due_on || ''}"></div>
    <button class="btn primary block" type="submit">${editing ? 'Wijzigingen opslaan' : 'Belofte toevoegen'}</button>`,
    editing ? `<button class="link danger" type="button" data-action="delete-promise" data-id="${p.id}">Verwijderen</button>` : '');
}

function sheetDate(m, contactId) {
  const editing = !!m;
  m = m || { label: '', day: '', month: '', year: '', contact_id: contactId };
  const c = contactById(m.contact_id);
  return sheetFrame(`data-form="date" data-cid="${m.contact_id}" ${editing ? `data-id="${m.id}"` : ''}`,
    `<div class="sheet-head"><h1 id="sheet-title">${editing ? 'Datum bewerken' : 'Belangrijke datum'}</h1></div>`,
    `<p class="small">${c ? 'Voor ' + esc(c.name) : ''}</p>
    <div class="field"><label for="d-label">Wat?</label>
      <input class="input" id="d-label" name="label" value="${esc(m.label)}" required maxlength="80" placeholder="Bijvoorbeeld: trouwdag, verjaardag Noor" autocomplete="off"></div>
    <div class="row3">
      <select class="select" name="day" aria-label="Dag" required><option value="">Dag</option>${Array.from({ length: 31 }, (_, i) => i + 1).map((d) => `<option value="${d}" ${m.day === d ? 'selected' : ''}>${d}</option>`).join('')}</select>
      <select class="select" name="month" aria-label="Maand" required><option value="">Maand</option>${MONTHS.map((x, i) => `<option value="${i + 1}" ${m.month === i + 1 ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <input class="input" name="year" type="number" inputmode="numeric" min="1900" max="2100" placeholder="Jaar" aria-label="Jaar (optioneel)" value="${m.year || ''}">
    </div>
    <p class="hint">Het jaar is optioneel. Vul je het in, dan toont de app hoeveel jaar het geleden is.</p>
    <button class="btn primary block" type="submit">${editing ? 'Wijzigingen opslaan' : 'Datum toevoegen'}</button>`,
    editing ? `<button class="link danger" type="button" data-action="delete-date" data-id="${m.id}">Verwijderen</button>` : '');
}

const pickerSupported = () => 'contacts' in navigator && 'ContactsManager' in window;

function sheetImport() {
  const items = state.importItems;
  if (!items) {
    return `
    <div class="sheet" role="dialog" aria-labelledby="sheet-title">
      <span class="grip" aria-hidden="true"></span>
      <div class="sheet-head"><h1 id="sheet-title">Contacten importeren</h1></div>
      <p class="body">Een iPhone laat webapps niet rechtstreeks in je contacten kijken. Je exporteert ze daarom eerst als vCard-bestand. Daarna kies je hier wie je overneemt.</p>
      <section class="box">
        <h2>Veel contacten tegelijk</h2>
        <ol class="steps">
          <li>Open de app <strong>Contacten</strong> en tik linksboven op <strong>Lijsten</strong>.</li>
          <li>Houd <strong>Alle contacten</strong> (of een eigen lijst) ingedrukt en kies <strong>Exporteer</strong>.</li>
          <li>Kies <strong>Bewaar in Bestanden</strong>.</li>
        </ol>
      </section>
      <section class="box">
        <h2>Eén contact</h2>
        <ol class="steps">
          <li>Open het contact en tik op <strong>Deel contact</strong>.</li>
          <li>Kies <strong>Bewaar in Bestanden</strong>.</li>
        </ol>
      </section>
      <p class="hint">Op een computer kan het ook via iCloud.com › Contacten: selecteer contacten en kies Exporteer vCard.</p>
      <label class="btn primary block" style="cursor:pointer">
        ${ICON.upload} vCard-bestand kiezen
        <input type="file" accept=".vcf,text/vcard,text/x-vcard" data-change="vcf-file" class="sr">
      </label>
      ${pickerSupported() ? `<button class="btn block" data-action="contact-picker">Kiezen uit je adresboek</button>` : ''}
      <button class="link muted" type="button" data-action="close-sheet">Annuleren</button>
    </div>`;
  }
  const chosen = items.filter((x) => x.selected).length;
  return `
  <form class="sheet" data-form="import" aria-labelledby="sheet-title">
    <span class="grip" aria-hidden="true"></span>
    <div class="sheet-head"><h1 id="sheet-title">${plural(items.length, 'contact', 'contacten')} gevonden</h1></div>
    <p class="small">Contacten die al in je app staan, zijn niet aangevinkt.</p>
    <div class="row2">
      <div class="field"><label for="i-circle">Kring</label>
        <select class="select" id="i-circle" name="circle">${Object.entries(CIRCLES).map(([k, v]) => `<option value="${k}" ${k === 'netwerk' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="i-rhythm">Herinneringen</label>
        <select class="select" id="i-rhythm" name="rhythm_days">${RHYTHMS.map(([d, l]) => `<option value="${d}" ${d === 0 ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="sec-head">
      <button class="link" type="button" data-action="import-all" style="padding-left:0">Alles aanvinken</button>
      <button class="link muted" type="button" data-action="import-none">Niets aanvinken</button>
    </div>
    <label><span class="sr">Zoeken</span><input class="search" type="search" placeholder="Zoeken in de lijst" data-input="importsearch" autocomplete="off"></label>
    <div class="pick-list">
      ${items.map((x, idx) => `
      <label class="import-row" data-name="${esc(x.name.toLowerCase())}">
        <input type="checkbox" data-change="import-toggle" data-idx="${idx}" ${x.selected ? 'checked' : ''}>
        <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
          <span class="tile-title">${esc(x.name)}</span>
          <span class="small">${[x.phone, x.email, x.company, x.duplicate ? 'staat al in je app' : ''].filter(Boolean).map(esc).join(' · ') || '&nbsp;'}</span>
        </span>
      </label>`).join('')}
    </div>
    <button class="btn primary block" type="submit" data-import-count ${chosen ? '' : 'disabled'}>${plural(chosen, 'contact', 'contacten')} importeren</button>
    <button class="link muted" type="button" data-action="close-sheet">Annuleren</button>
  </form>`;
}

function renderSheet() {
  const root = $('#sheet-root');
  const s = state.sheet;
  if (!s) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
  let html = '';
  if (s.type === 'log') html = sheetLog(contactById(s.id), s.iid ? state.interactions.find((i) => i.id === s.iid) : null);
  if (s.type === 'pick') html = sheetPick();
  if (s.type === 'contact') html = sheetContact(s.id ? contactById(s.id) : null);
  if (s.type === 'promise') html = sheetPromise(s.pid ? state.promises.find((p) => p.id === s.pid) : null, s.id);
  if (s.type === 'date') html = sheetDate(s.did ? state.dates.find((d) => d.id === s.did) : null, s.id);
  if (s.type === 'import') html = sheetImport();
  root.innerHTML = `<div class="overlay" data-action="overlay">${html}</div>`;
  document.body.style.overflow = 'hidden';
  if (SpeechRec) $$('[data-action="dictate"]', root).forEach((b) => (b.hidden = false));
  const logForm = $('form[data-form="log"]', root);
  if (logForm) updateLogForm(logForm);
}

   ═══════════════════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, undo) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button type="button" data-toast-undo>Ongedaan maken</button>' : ''}</div>`;
  if (undo) $('[data-toast-undo]', root).addEventListener('click', () => { root.innerHTML = ''; undo(); }, { once: true });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (root.innerHTML = ''), undo ? 6000 : 3200);
}

function go(view) {
  state.view = view;
  state.sheet = null;
  render();
  window.scrollTo(0, 0);
}
function openContact(id) {
  if (state.view !== 'contact') state.returnTo = state.view;
  state.contactId = id;
  go('contact');
}
function openSheet(sheet) { state.sheet = sheet; renderSheet(); }
function closeSheet() { if (recognizer) recognizer.stop(); state.sheet = null; state.importItems = null; renderSheet(); }

/* ═══════════════════════════════════════════════════════════════════════
   12. INSPREKEN
   ═══════════════════════════════════════════════════════════════════════ */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
function toggleDictation(btn) {
  if (recognizer) { recognizer.stop(); return; }
  const area = btn.closest('form').querySelector('textarea');
  const label = btn.querySelector('span');
  recognizer = new SpeechRec();
  recognizer.lang = 'nl-BE';
  recognizer.interimResults = false;
  recognizer.continuous = true;
  recognizer.onresult = (e) => {
    const text = Array.from(e.results).slice(e.resultIndex).map((r) => r[0].transcript).join(' ').trim();
    if (text) area.value = (area.value ? area.value.trimEnd() + ' ' : '') + text;
  };
  recognizer.onend = () => { recognizer = null; if (label) label.textContent = 'Inspreken'; };
  recognizer.onerror = (e) => { if (e.error !== 'aborted') toast('Inspreken lukt niet: ' + e.error); };
  recognizer.start();
  if (label) label.textContent = 'Stoppen';
}

/* ═══════════════════════════════════════════════════════════════════════
   13. IMPORTEREN (vCard en adresboek)
   ═══════════════════════════════════════════════════════════════════════ */
function decodeQP(v) {
  try { return decodeURIComponent(v.replace(/=\r?\n/g, '').replace(/%/g, '%25').replace(/=([0-9A-F]{2})/gi, '%$1')); } catch { return v; }
}
const unescapeV = (v) => v.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1').trim();

function parseVCards(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n');
  const cards = [];
  let cur = null;
  for (const line of lines) {
    if (/^BEGIN:VCARD/i.test(line)) { cur = { tels: [], emails: [] }; continue; }
    if (/^END:VCARD/i.test(line)) { if (cur) cards.push(cur); cur = null; continue; }
    if (!cur) continue;
    const idx = line.indexOf(':');
    if (idx < 0) continue;
    const key = line.slice(0, idx).replace(/^item\d+\./i, '');
    let value = line.slice(idx + 1);
    const [name, ...params] = key.split(';');
    const N = name.toUpperCase();
    const P = params.join(';').toUpperCase();
    if (/QUOTED-PRINTABLE/.test(P)) value = decodeQP(value);
    switch (N) {
      case 'FN': cur.fn = unescapeV(value); break;
      case 'N': cur.n = value.split(/(?<!\\);/).map(unescapeV); break;
      case 'TEL': cur.tels.push({ v: unescapeV(value), score: (/CELL|IPHONE|MOBILE/.test(P) ? 2 : 0) + (/PREF/.test(P) ? 1 : 0) }); break;
      case 'EMAIL': cur.emails.push({ v: unescapeV(value), score: /PREF/.test(P) ? 1 : 0 }); break;
      case 'ORG': cur.org = unescapeV(value.split(/(?<!\\);/)[0]); break;
      case 'TITLE': cur.title = unescapeV(value); break;
      case 'BDAY': cur.bday = { v: value.trim(), omitYear: /X-APPLE-OMIT-YEAR/.test(P) }; break;
      case 'NOTE': cur.note = unescapeV(value); break;
    }
  }
  return cards.map((c) => {
    const name = (c.fn || [c.n?.[1], c.n?.[2], c.n?.[0]].filter(Boolean).join(' ') || c.org || '').replace(/\s+/g, ' ').trim();
    const tel = c.tels.sort((a, b) => b.score - a.score)[0];
    const mail = c.emails.sort((a, b) => b.score - a.score)[0];
    let bd = null, bm = null, by = null;
    if (c.bday) {
      const m = c.bday.v.match(/^(\d{4}|--)-?(\d{2})-?(\d{2})/);
      if (m) { bm = Number(m[2]); bd = Number(m[3]); if (/^\d{4}$/.test(m[1]) && !c.bday.omitYear && m[1] !== '1604') by = Number(m[1]); }
    }
    const company = [c.org, c.title].filter(Boolean).join(' · ') || null;
    return { name, phone: tel?.v || null, email: mail?.v || null, company, birthday_day: bd, birthday_month: bm, birthday_year: by, memory: c.note || null };
  }).filter((x) => x.name);
}

function prepareImport(list) {
  const existing = new Set(state.contacts.map((c) => c.name.trim().toLowerCase()));
  const seen = new Set();
  const items = [];
  for (const x of list) {
    const key = x.name.trim().toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    const duplicate = existing.has(key);
    items.push({ ...x, duplicate, selected: !duplicate });
  }
  items.sort((a, b) => a.name.localeCompare(b.name, 'nl'));
  if (!items.length) { toast('Geen contacten gevonden in dit bestand.'); return; }
  state.importItems = items;
  renderSheet();
}

async function readVcf(file) {
  if (!file) return;
  const text = await file.text();
  prepareImport(parseVCards(text));
}

async function useContactPicker() {
  try {
    const picked = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
    prepareImport(picked.map((p) => ({ name: (p.name && p.name[0]) || '', phone: (p.tel && p.tel[0]) || null, email: (p.email && p.email[0]) || null, company: null, birthday_day: null, birthday_month: null, birthday_year: null, memory: null })));
  } catch (err) {
    if (err && err.name !== 'AbortError') toast('Kiezen uit je adresboek lukt niet op dit toestel.');
  }
}

function updateImportCount() {
  const btn = $('[data-import-count]');
  if (!btn || !state.importItems) return;
  const n = state.importItems.filter((x) => x.selected).length;
  btn.textContent = `${plural(n, 'contact', 'contacten')} importeren`;
  btn.disabled = !n;
}

/* ═══════════════════════════════════════════════════════════════════════
   14. PUSHMELDINGEN
   ═══════════════════════════════════════════════════════════════════════ */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64uToBytes = (s) => { const b = (s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(b), (ch) => ch.charCodeAt(0)); };

async function refreshPushState() {
  if (!pushSupported()) { state.push = 'unsupported'; return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    state.push = sub ? 'on' : Notification.permission === 'denied' ? 'denied' : 'off';
  } catch { state.push = 'off'; }
}

function pushSection() {
  let content;
  if (state.push === 'checking') content = `<p class="small">Even kijken…</p>`;
  else if (state.push === 'unsupported') content = isIOS && !isStandalone()
    ? `<p class="small">Op een iPhone werken meldingen enkel als de app op je beginscherm staat. Open deze pagina in Safari, tik op het deelicoon en kies <strong>Zet op beginscherm</strong>. Open de app daarna via het nieuwe icoon.</p>`
    : `<p class="small">Dit toestel of deze browser ondersteunt geen pushmeldingen.</p>`;
  else if (state.push === 'denied') content = `<p class="small">Meldingen zijn geweigerd. Zet ze aan via Instellingen › Meldingen op je toestel en kom dan terug.</p>`;
  else if (state.push === 'off') content = `<p class="small">Krijg ’s ochtends een melding als iemand aan de beurt is, er een verjaardag of belangrijke datum is, of een belofte vandaag af moet. Op dagen zonder iets krijg je niets.</p>
      <button class="btn primary" style="align-self:flex-start" data-action="push-on">${ICON.bell} Meldingen aanzetten</button>`;
  else content = `<p class="small">Meldingen staan aan op dit toestel.</p>
      <div class="row-btns"><button class="btn sm" data-action="push-test">Testmelding sturen</button><button class="btn sm" data-action="push-off">Meldingen uitzetten</button></div>`;
  return `<section class="box"><h2>Meldingen</h2>${content}</section>`;
}

async function enablePush() {
  if (VAPID_PUBLIC_KEY.includes('VUL-')) { toast('Vul eerst VAPID_PUBLIC_KEY in bovenaan index.html.'); return; }
  const permission = await Notification.requestPermission(); // moet de eerste stap na de tik zijn (iOS)
  if (permission !== 'granted') { state.push = permission === 'denied' ? 'denied' : 'off'; toast('Meldingen zijn niet toegestaan.'); return render(); }
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC_KEY) });
    const j = sub.toJSON();
    const { error } = await db.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, device: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
    if (error) throw error;
    state.push = 'on';
    toast('Meldingen staan aan');
  } catch (err) { toast('Meldingen aanzetten mislukt: ' + (err.message || err)); }
  render();
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) { await db.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    state.push = 'off';
    toast('Meldingen staan uit');
  } catch (err) { toast('Uitzetten mislukt: ' + (err.message || err)); }
  render();
}

async function testPush() {
  const { data, error } = await db.functions.invoke('dagelijkse-melding', { body: { test: true } });
  if (error) { toast('Testmelding mislukt. Staat de Edge Function online en zijn de geheimen ingevuld?'); return; }
  toast(data && data.sent ? 'Testmelding verstuurd' : 'Geen toestel gevonden. Zet meldingen opnieuw aan.');
}
