   15. LOGPANEEL
   ═══════════════════════════════════════════════════════════════════════ */
function updateLogForm(form) {
  const c = contactById(form.dataset.id);
  const kind = form.elements.kind.value;
  const isContact = isContactKind(kind);
  const kindHint = form.querySelector('[data-kind-hint]');
  kindHint.textContent = isContact
    ? 'Telt als contactmoment.'
    : kind === 'notitie' ? 'Een notitie telt niet als contact en verandert niets aan je herinneringen.'
    : 'Een gebeurtenis, zoals een nieuwe job of een verhuis. Telt niet als contact.';
  const section = form.querySelector('[data-next-section]');
  if (!section) return;
  section.hidden = !isContact;
  const mode = form.elements.next_mode.value;
  const dateInput = form.elements.next_contact_on;
  dateInput.hidden = mode !== 'date';
  dateInput.required = mode === 'date' && isContact;
  const hint = form.querySelector('[data-next-hint]');
  hint.hidden = mode === 'date';
  if (mode === 'auto' && c) hint.textContent = nextHint(c, form.elements.happened_on.value || todayISO());
}

/* ═══════════════════════════════════════════════════════════════════════
   16. GEBEURTENISSEN
   ═══════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;

  switch (a) {
    case 'overlay': if (e.target === el) closeSheet(); return;
    case 'go': return go(el.dataset.view);
    case 'open-contact': state.sheet = null; return openContact(id);
    case 'back': return go(state.returnTo || 'today');
    case 'close-sheet': return closeSheet();
    case 'quick-log': return openSheet({ type: 'pick' });
    case 'pick-contact': return openSheet({ type: 'log', id });
    case 'log': return openSheet({ type: 'log', id });
    case 'edit-interaction': { const i = state.interactions.find((x) => x.id === id); return i && openSheet({ type: 'log', id: i.contact_id, iid: id }); }
    case 'new-contact': return openSheet({ type: 'contact' });
    case 'edit-contact': return openSheet({ type: 'contact', id });
    case 'new-promise': return openSheet({ type: 'promise', id: id || null });
    case 'edit-promise': return openSheet({ type: 'promise', pid: id });
    case 'new-date': return openSheet({ type: 'date', id });
    case 'edit-date': return openSheet({ type: 'date', did: id, id: (state.dates.find((d) => d.id === id) || {}).contact_id });
    case 'import': state.importItems = null; return openSheet({ type: 'import' });
    case 'contact-picker': return useContactPicker();
    case 'import-all': case 'import-none':
      state.importItems.forEach((x) => (x.selected = a === 'import-all'));
      $$('[data-change="import-toggle"]').forEach((cb) => (cb.checked = a === 'import-all'));
      return updateImportCount();
    case 'toggle-done': state.showDone = !state.showDone; return render();
    case 'toggle-archived': state.showArchived = !state.showArchived; state.circleFilter = 'alle'; return render();
    case 'circle-filter': state.circleFilter = el.dataset.key; return render();
    case 'log-filter': state.logFilter = el.dataset.key; return render();
    case 'dictate': return toggleDictation(el);
    case 'push-on': return enablePush();
    case 'push-off': return disablePush();
    case 'push-test': return testPush();
    case 'logout': await db.auth.signOut(); return;
    case 'toggle-favorite': { const c = contactById(id); return run(db.from('contacts').update({ favorite: !c.favorite }).eq('id', id), c.favorite ? 'Niet langer favoriet' : 'Toegevoegd aan favorieten'); }
    case 'delete-interaction': return removeWithUndo('interactions', state.interactions.find((x) => x.id === id), 'Verwijderd');
    case 'delete-promise': return removeWithUndo('promises', state.promises.find((x) => x.id === id), 'Belofte verwijderd');
    case 'delete-date': return removeWithUndo('important_dates', state.dates.find((x) => x.id === id), 'Datum verwijderd');
    case 'archive-contact': {
      const c = contactById(id);
      state.sheet = null;
      await run(db.from('contacts').update({ archived: !c.archived }).eq('id', id), c.archived ? 'Uit archief gehaald' : 'Gearchiveerd');
      return;
    }
    case 'delete-contact': {
      const c = contactById(id);
      if (!confirm(`${c.name} definitief verwijderen, met de volledige tijdlijn, beloftes en datums? Dit kan niet ongedaan worden. Tip: archiveren verbergt iemand zonder iets te wissen.`)) return;
      state.sheet = null;
      state.view = state.returnTo || 'today';
      return run(db.from('contacts').delete().eq('id', id), 'Contact verwijderd');
    }
    case 'export': {
      const blob = new Blob([JSON.stringify({ geexporteerd_op: new Date().toISOString(), contacten: state.contacts, logboek: state.interactions, beloftes: state.promises, datums: state.dates }, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `relaties-${todayISO()}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      return;
    }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  const ch = el.dataset.change;
  if (ch === 'toggle-promise') {
    const done = el.checked;
    run(db.from('promises').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', el.dataset.id), done ? 'Afgevinkt' : 'Terug open gezet');
  }
  if (ch === 'vcf-file') readVcf(el.files[0]);
  if (ch === 'import-toggle') { state.importItems[Number(el.dataset.idx)].selected = el.checked; updateImportCount(); }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  const inp = el.dataset.input;
  if (inp === 'search') { state.search = el.value; $('#results').innerHTML = contactsResults(); return; }
  if (inp === 'logsearch') { state.logSearch = el.value; $('#results').innerHTML = logResults(); return; }
  if (inp === 'pick' || inp === 'importsearch') {
    const q = el.value.trim().toLowerCase();
    $$(inp === 'pick' ? '.pick' : '.import-row', $('#sheet-root')).forEach((row) => (row.hidden = q && !row.dataset.name.includes(q)));
    return;
  }
  const form = el.closest('form[data-form="log"]');
  if (form) updateLogForm(form);
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.sheet) closeSheet(); });

const val = (f, k) => (f.get(k) || '').toString().trim();
const numOrNull = (f, k) => (val(f, k) ? Number(val(f, k)) : null);

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const f = new FormData(form);
  const type = form.dataset.form;
  const submitBtn = form.querySelector('[type=submit]');
  if (submitBtn) submitBtn.disabled = true;

  try {
    if (type === 'login') {
      const email = val(f, 'email'), password = f.get('password');
      const mode = e.submitter?.value || 'login';
      const { error } = mode === 'signup'
        ? await db.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin + window.location.pathname } })
        : await db.auth.signInWithPassword({ email, password });
      if (error) toast(error.message === 'Invalid login credentials' ? 'E-mailadres of wachtwoord klopt niet.' : error.message);
      else if (mode === 'signup') toast('Account aangemaakt. Bevestig eventueel via de mail en log dan in.');
      return;
    }

    if (type === 'quicknote') {
      const note = val(f, 'note');
      if (!note) return;
      await run(db.from('interactions').insert({ contact_id: form.dataset.id, kind: 'notitie', happened_on: todayISO(), note }), 'Notitie opgeslagen');
      return;
    }

    if (type === 'log') {
      if (recognizer) recognizer.stop();
      const contactId = form.dataset.id;
      const kind = val(f, 'kind');
      const row = { kind, happened_on: val(f, 'happened_on'), note: val(f, 'note') || null };
      if (form.dataset.iid) {
        if (await run(db.from('interactions').update(row).eq('id', form.dataset.iid), 'Wijzigingen opgeslagen')) closeSheet();
        return;
      }
      const ok = await run(db.from('interactions').insert({ ...row, contact_id: contactId }), isContactKind(kind) ? null : 'Opgeslagen');
      if (!ok) return;
      if (isContactKind(kind)) {
        const next = val(f, 'next_mode') === 'date' ? val(f, 'next_contact_on') : null;
        await run(db.from('contacts').update({ next_contact_on: next }).eq('id', contactId), 'Contact gelogd');
      }
      closeSheet();
      return;
    }

    if (type === 'contact') {
      const id = form.dataset.id;
      const old = id ? contactById(id) : null;
      const rhythm = Number(val(f, 'rhythm_days'));
      const row = {
        name: val(f, 'name'), circle: val(f, 'circle'), rhythm_days: rhythm,
        phone: val(f, 'phone') || null, email: val(f, 'email') || null, company: val(f, 'company') || null,
        birthday_day: numOrNull(f, 'birthday_day'), birthday_month: numOrNull(f, 'birthday_month'), birthday_year: numOrNull(f, 'birthday_year'),
        memory: val(f, 'memory') || null, favorite: f.get('favorite') === 'on'
      };
      if (old && old.rhythm_days !== rhythm) row.next_contact_on = null;
      if (id) {
        if (await run(db.from('contacts').update(row).eq('id', id), 'Wijzigingen opgeslagen')) closeSheet();
      } else {
        const { data, error } = await db.from('contacts').insert(row).select().single();
        if (error) { toast('Opslaan mislukt: ' + error.message); return; }
        state.sheet = null;
        toast('Contact toegevoegd');
        if (state.view !== 'contact') state.returnTo = state.view;
        state.contactId = data.id; state.view = 'contact';
        await loadAll();
        window.scrollTo(0, 0);
      }
      return;
    }

    if (type === 'promise') {
      const row = { description: val(f, 'description'), contact_id: val(f, 'contact_id') || null, due_on: val(f, 'due_on') || null };
      const q = form.dataset.id ? db.from('promises').update(row).eq('id', form.dataset.id) : db.from('promises').insert(row);
      if (await run(q, form.dataset.id ? 'Wijzigingen opgeslagen' : 'Belofte toegevoegd')) closeSheet();
      return;
    }

    if (type === 'date') {
      const row = { label: val(f, 'label'), day: numOrNull(f, 'day'), month: numOrNull(f, 'month'), year: numOrNull(f, 'year') };
      const q = form.dataset.id ? db.from('important_dates').update(row).eq('id', form.dataset.id) : db.from('important_dates').insert({ ...row, contact_id: form.dataset.cid });
      if (await run(q, form.dataset.id ? 'Wijzigingen opgeslagen' : 'Datum toegevoegd')) closeSheet();
      return;
    }

    if (type === 'import') {
      const circle = val(f, 'circle');
      const rhythm = Number(val(f, 'rhythm_days'));
      const rows = state.importItems.filter((x) => x.selected).map((x) => ({
        name: x.name.slice(0, 120), circle, rhythm_days: rhythm, phone: x.phone, email: x.email, company: x.company,
        birthday_day: x.birthday_day, birthday_month: x.birthday_month, birthday_year: x.birthday_year, memory: x.memory
      }));
      for (let i = 0; i < rows.length; i += 200) {
        const { error } = await db.from('contacts').insert(rows.slice(i, i + 200));
        if (error) { toast('Importeren mislukt: ' + error.message); return; }
      }
      closeSheet();
      toast(`${plural(rows.length, 'contact', 'contacten')} geïmporteerd`);
      state.view = 'contacts';
      await loadAll();
    }
  } finally {
    if (submitBtn && document.body.contains(submitBtn)) submitBtn.disabled = false;
  }
});

/* ═══════════════════════════════════════════════════════════════════════
   17. OPSTARTEN
   ═══════════════════════════════════════════════════════════════════════ */
async function start() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {}).finally(async () => { await refreshPushState(); if (state.view === 'more') render(); });
  } else state.push = 'unsupported';

  if (!window.supabase) { $('#app').innerHTML = '<p class="loading">De app kon niet laden. Controleer je internetverbinding.</p>'; return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await db.auth.getSession();
  state.session = data.session;
  render();
  if (state.session) loadAll();
  db.auth.onAuthStateChange((_event, session) => {
    const wasIn = !!state.session;
    state.session = session;
    if (session && !wasIn) { state.loaded = false; render(); loadAll(); }
    if (!session) { state.loaded = false; state.view = 'today'; state.sheet = null; render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.session && !state.sheet) loadAll();
  });
}
start();
</script>
